name: poultry_mobile
description: تطبيق إدارة المداجن - الموبايل
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # الحزم الداخلية
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  
  # إدارة الحالة
  flutter_riverpod: ^2.4.9
  
  # قاعدة البيانات المحلية
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0  # ✅ أضفت هذا (مستخدم في LocalDatabase)
  
  # Supabase
  supabase_flutter: ^2.3.4
  
  # الشبكة
  connectivity_plus: ^6.0.3
  
  # UI
  image_picker: ^1.0.4
  google_fonts: ^6.1.0

  # الملاحظات الصوتية (محلية فقط)
  record: ^7.1.1
  audioplayers: ^6.1.0
  
  # التخزين المحلي
  shared_preferences: ^2.2.2
  csv: ^6.0.0
  
  # الأدوات
  uuid: ^4.2.1

  # المتغيرات البيئية
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
