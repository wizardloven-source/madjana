# ============================================================================
#  docker-compose.yml — قاعدة بيانات محلية للاختبار المنطقي
#  ---------------------------------------------------------------------------
#  الغرض: تشغيل PostgreSQL 16 داخل حاوية، كبديل عن تثبيت PostgreSQL على
#  ويندوز. هذا يعالج القيد البيئي 0xC0000142 الذي يمنع إنشاء أي عملية
#  خلفية في PostgreSQL المثبّت محلياً على ويندوز.
#
#  تحذير: هذه الحاوية للاختبار المحلي فقط. لا تضع بيانات إنتاج هنا إطلاقاً.
# ============================================================================

services:
  db:
    # PostgreSQL 16. انتبه لانحراف الإصدار: التثبيت المحلي على ويندوز هو 15،
    # وهذه الحاوية 16. دلالات RLS متطابقة في الإصدارين، لكن يُفضّل توحيد
    # الإصدار بين CI والتطوير المحلي قبل أي تحقق نهائي. التفاصيل في
    # supabase/MIGRATION_ORDER.md
    image: postgres:16
    container_name: madjana_pg

    # ── المنفذ ─────────────────────────────────────────────────────────────
    # الافتراضي 5433 وليس 5432 عن قصد: هذا هو المنفذ الذي تتوقّعه السكربتات
    # القائمة بالفعل ومكتوب كقيمة ثابتة (hardcoded) فيها:
    #     build_test_db.py : HOST و PORT = 127.0.0.1:5433
    #     run_all.py       : -h 127.0.0.1 -p 5433
    # اختيار 5432 هنا سيُفشل الاختبارات أو يوجّهها إلى القاعدة الخطأ.
    # يمكن تجاوزه بمتغير بيئة، وهو مفيد في CI حيث تتضارب المنافذ:
    #     PGPORT=55432 docker compose up -d
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"

    # ── المصادقة ───────────────────────────────────────────────────────────
    # trust أي在没有 كلمة مرور. هذا مقصود وليس إهمالاً:
    #   build_test_db.py يتصل بـ password="" (السطران 83 و 94)، فأي كلمة
    #   مرور تجعله يفشل فوراً. و trust يزيل خطوة إدخال كلمة مرور من كل
    #   أمر psql متكرر، وهو مناسب لبيئة ثقة محلية على loopback فقط.
    #
    # تحذير أمني: مع trust يصبح أي منفذ محلي مفتوحاً لـ superuser بلا كلمة
    #   مرور. لذلك حصر الـ bind على 127.0.0.1 أعلاه إلزامي أمنياً.
    #   لا تحوّل المنفذ إلى 0.0.0.0 ولا تسقط سطر الـ bind هذا، إلا إذا
    #   غيّرت طريقة المصادقة في الوقت نفسه.
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

      # encoding=UTF8 ضروري: init.sql والبيانات التجريبية تحتوي نصوصاً
      # عربية (أسماء مزارع، عملاء، فئات). على قاعدة latin1 يفشل الإدخال
      # أو يتلف النص.
      #
      # locale=C.UTF-8 وليس en_US.UTF-8: صورة postgres الرسمية مبنية على
      # Debian ولا تُولّد en_US.UTF-8 مسبقاً، فيفشل initdb ولا تقلع
      # الحاوية أبداً. أما C.UTF-8 فمتوفّر دائماً ويضمن تخزين UTF-8 صحيحاً.
      #
      # أثر جانبي مقبول: C.UTF-8 يرتّب حسب ترتيب البايت، فيصبح ORDER BY على
      # الأسماء العربية غير لغوي. الحتمية مضمونة، وهي ما تحتاجه الاختبارات،
      # أما الترتيب اللغوي فيحتاج ICU.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    # ── التخزين الدائم ─────────────────────────────────────────────────────
    # volume مُسمّى وليس bind mount: أسرع على ويندوز (مشكلة أداء معروفة
    # عند bind mount مع Windows Defender)، ولا تتغير الملكية عند إعادة
    # الإنشاء.
    volumes:
      - madjana_pgdata:/var/lib/postgresql/data

    # ── الفحص الصحي ───────────────────────────────────────────────────────
    # exec form وليس shell form: يتجنّب توسعة الرمز $ بواسطة compose، ويجعل
    # سلوك الفحص مباشراً وواضحاً دون quoting هش.
    # start_period بمقدار 30s يمنح مدخل postgres وقتاً لإنهاء التهيئة قبل
    # اعتبار الفحص فاشلاً. بدونه يتحوّل بدء الحاوية إلى دورة فشل وهمية.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

    # ── الموارد ────────────────────────────────────────────────────────────
    # shm_size أكبر: يستخدم PostgreSQL الذاكرة المشتركة للـ parallel query
    # وأثناء الصيانة. القيمة الافتراضية الصغيرة قد تُفشل عمليات vacuum.
    shm_size: "256mb"

    restart: unless-stopped
    networks:
      - madjana

volumes:
  madjana_pgdata:

networks:
  madjana:
    name: madjana_test_net

# ============================================================================
#  قرار تصميمي: لا نُركّب سكربتات التهيئة في /docker-entrypoint-initdb.d
#  ---------------------------------------------------------------------------
#  كان يمكن وضع init.sql وكل الهجرات في مجلد initdb.d ليجريها مدخل postgres
#  تلقائياً عند أول إقلاع. استُبعد هذا عن قصد، لثلاثة أسباب:
#
#  1. build_test_db.py يطبّق init.sql مرتين (pass 1 و pass 2) لسبب موثّق في
#     الملف نفسه: لقطة المخطط تحتوي ALTER و GRANT على جداول قبل أن تُنشأ
#     بنحو ألف سطر، فتفشل في التمريرة الأولى تاركةً RLS والصلاحيات ناقصة.
#     التمريرة الثانية هي الإشارة الصحيحة، وهي غير قابلة للتعبير في initdb.d.
#
#  2. مجلد initdb.d يعمل مرة واحدة فقط عند تهيئة مجلد البيانات. أي تعديل
#     لاحق على init.sql أو إضافة هجرة جديدة لن يُطبَّق على حاوية قائمة،
#     فيخلق وهم أن الاختبارات غطّت أحدث نسخة من المخطط.
#
#  3. وجود مسارين لبناء المخطط يعني انحرافاً محتملاً (schema drift): يعمل
#     محلياً ويختلف عن الإنتاج. وهذه أخطر فئة من الأخطاء تحديداً في سياق
#     RLS، لأن الاختبار قد ينجح على مخطط غير مطابق للمنشور.
#
#  لذلك: هذه الحاوية تقدّم PostgreSQL فقط، ويبقى build_test_db.py المالك
#  الوحيد لمنطق بناء المخطط، وهو نفس المنطق الذي يشغّله CI لاحقاً.
# ============================================================================