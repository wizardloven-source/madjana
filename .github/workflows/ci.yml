name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  data_package:
    name: data package — analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (packages/data)
        working-directory: packages/data
        run: flutter pub get

      - name: Analyze (packages/data)
        working-directory: packages/data
        run: flutter analyze --no-fatal-infos

      - name: Test (packages/data)
        working-directory: packages/data
        run: flutter test --coverage

      - name: Coverage gate (>= 45% of lines)
        working-directory: packages/data
        shell: bash
        run: |
          lf=$(grep -E '^LF:' coverage/lcov.info | sed 's/LF://' | awk '{s+=$1} END {print s+0}')
          lh=$(grep -E '^LH:' coverage/lcov.info | sed 's/LH://' | awk '{s+=$1} END {print s+0}')
          pct=$((( lh * 100 ) / lf))
          echo "line coverage: ${pct}% (${lh}/${lf})"
          if [ "$pct" -lt 45 ]; then
            echo "::error::Coverage gate failed: ${pct}% is below the 45% threshold."
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-package-coverage
          path: packages/data/coverage

  db_migration_test:
    name: db — schema drift + migration apply/rollback/re-apply
    runs-on: ubuntu-latest
    # Environment aligned with p0_rls_guard.yml (the proven-green recipe):
    # postgres:16 + C.UTF-8 + trust, port 5433, Python 3.10. The old combo
    # (supabase/postgres:15.1.1.61, unpinned Python, port 5432) had failed at
    # "Build test database" on every run — same script passes on this recipe.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: postgres
      PGDATABASE: madjana_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Same version as p0_rls_guard.yml and the local machine, so the
          # scripts behave identically on CI and in development.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: supabase/tests/requirements.txt

      # ── Step 1: static drift gate. Needs no database, runs first so a
      #    schema contradiction fails in seconds instead of after boot.
      - name: Verify schema drift (static)
        run: python supabase/tools/verify_schema_drift.py

      - name: Verify every migration (structure / idempotency / reference)
        run: |
          # UNIFIED_schema.sql is a BOOTSTRAP, not an incremental migration:
          # it is a from-scratch snapshot whose whole job is bare
          # CREATE TABLE. Demanding idempotency of it is meaningless, and
          # init.sql has the same character. Both are excluded for that
          # reason, not to hide a failure.
          python supabase/tools/verify_migration.py \
            $(ls -1 supabase/migrations/*.sql | grep -v 'UNIFIED_schema')

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Build the real test database first, so a broken migration surfaces
      # with the statement that failed rather than as a bare exit code.
      # Same script p0_rls_guard.yml uses, pointed at the same service.
      - name: Build test database
        run: |
          python -m pip install --upgrade pip -r supabase/tests/requirements.txt
          python supabase/tests/build_test_db.py

      # ── Step 2: apply -> rollback -> re-apply.
      #    Proves the migrations are idempotent in both directions and that
      #    their rollback actually reverses them.
      - name: Apply all migrations
        env:
          PGPASSWORD: postgres
        run: |
          # Rollbacks are excluded: they share the 14-digit prefix but undo
          # the migration beside them. Including them would create
          # flock_movements and drop it again in the same run. UPGRADE_* files
          # are one-off production data fixes (they reference real farms) --
          # same reason build_test_db.py skips them as "not part of the
          # numbered chain".
          for f in $(ls -1 supabase/migrations/*.sql \
                       | grep -v 'rollback' | grep -v 'UNIFIED_schema' | grep -v 'UPGRADE'); do
            echo "::group::apply $f"
            # incremental ALTERs -- they need the schema build_test_db
            # created in madjana_test; the bare `postgres` db is empty.
            psql -h "$PGHOST" -p "$PGPORT" -U postgres -d madjana_test -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Rollback W0.1
        env:
          PGPASSWORD: postgres
        run: psql -h "$PGHOST" -p "$PGPORT" -U postgres -d madjana_test -v ON_ERROR_STOP=1 -q \
          -f supabase/migrations/20260927000001_rollback_missing_tables.sql

      - name: Re-apply W0.1 (idempotency proof)
        env:
          PGPASSWORD: postgres
        run: psql -h "$PGHOST" -p "$PGPORT" -U postgres -d madjana_test -v ON_ERROR_STOP=1 -q \
          -f supabase/migrations/20260927000000_add_missing_tables.sql

      - name: Idempotency — apply every migration a second time
        env:
          PGPASSWORD: postgres
        run: |
          # A migration that fails on its second run is not idempotent, and
          # every migration in this repo promises to be. Fail loudly here
          # rather than in production. Rollbacks excluded, as above.
          for f in $(ls -1 supabase/migrations/*.sql \
                       | grep -v 'rollback' | grep -v 'UNIFIED_schema' | grep -v 'UPGRADE'); do
            echo "::group::re-apply $f"
            psql -h "$PGHOST" -p "$PGPORT" -U postgres -d madjana_test -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Registry allowlist vs live schema
        env:
          PGPASSWORD: postgres
        run: |
          # Every table named in the sync allowlist must actually exist.
          psql -h "$PGHOST" -p "$PGPORT" -U postgres -d madjana_test -v ON_ERROR_STOP=1 -q -c \
            "DO \$\$ DECLARE t text; BEGIN
               FOR t IN SELECT table_name FROM public.sync_table_registry LOOP
                 IF to_regclass('public.' || t) IS NULL THEN
                   RAISE EXCEPTION 'registry lists %, which does not exist', t;
                 END IF;
               END LOOP;
             END \$\$;"

      # ── Step 3: the SQL assertion suites (RLS, isolation, sync).
      - name: Install test requirements
        run: pip install -r supabase/tests/requirements.txt

      - name: Run SQL test suites
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGDATABASE: madjana_test
        run: python supabase/tests/run_all.py
